<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <spam class="logo">🌐 Meu Site</spam>
        <nav class="menu">
            <a href="index.html" class="ativo">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section class="conteudo">
            <h1>Contato</h1>
            <p>Preencha o formulário abaixo</p>

            <form class="form" action="#">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="name" placeholder="Seu nome"></input>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="voce@email.com"></input>
                </div>
                <div class="campo">
                    <label for="msg">Mensagem</label>
                    <textarea type="msg" id="msg" rows="4" placeholder="Escreva sua msg"></textarea>
                </div>
                <button type="submit" class="botao">
                    enviar
                </button>
            </form>
        </section>
    </main>
</body>
</html>
